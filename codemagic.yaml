workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
      - name: Build IOS App
        script: |
          flutter build ios --release --no-codesign
      - name: Package .app into .ipa (Alternative)
        script: |
          cd build/ios/iphoneos
          mkdir Payload
          mv Runner.app Payload/
          zip -r app.ipa Payload
          mkdir -p ../../../build/ios/ipa
          mv app.ipa ../../../build/ios/ipa/gym_donrossi.ipa
    artifacts:
      - build/ios/ipa/*.ipa