workflows:
  ios-release-workflow:
    name: Gym Donrossi iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
      - name: Build iOS IPA (Release)
        script: |
          flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa